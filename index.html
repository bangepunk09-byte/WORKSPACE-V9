<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Suppress benign Vite HMR closed WebSocket error in AI Studio iframe environment
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason?.message || event.reason || '');
          if (typeof reason === 'string' && (reason.indexOf('WebSocket closed without opened') !== -1 || reason.indexOf('failed to connect to websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        var origError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).join(' ');
          if (text.indexOf('failed to connect to websocket') !== -1 || text.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5364" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CIRCLE" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CIRCLE Workspace ASLI RI</title>
    <meta name="description" content="Enterprise collaboration portal with Google Auth, Calendar, and Drive integration" />
    <meta property="og:title" content="CIRCLE Workspace ASLI RI" />
    <meta property="og:description" content="Enterprise collaboration portal with Google Auth, Calendar, and Drive integration" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var p = JSON.parse(localStorage.getItem("circle_user_prefs") || "{}");
          var m = p.theme_mode;
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
