<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Prevent @vite/client from throwing "WebSocket closed without opened" in proxy/iframe environments where HMR is disabled
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var WrappedWebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var fakeWs = {
                url: url,
                protocol: 'vite-hmr',
                readyState: 1,
                 bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() { this.readyState = 3; },
                addEventListener: function(type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(function() { listener({ type: 'open' }); }, 10);
                  }
                  if (type === 'message' && typeof listener === 'function') {
                    setTimeout(function() { listener({ type: 'message', data: JSON.stringify({ type: 'connected' }) }); }, 20);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof fakeWs.onopen === 'function') fakeWs.onopen({ type: 'open' });
                if (typeof fakeWs.onmessage === 'function') fakeWs.onmessage({ type: 'message', data: JSON.stringify({ type: 'connected' }) });
              }, 15);
              return fakeWs;
            }
            return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
          WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason?.message || event.reason || '');
          if (typeof reason === 'string' && (reason.indexOf('WebSocket closed without opened') !== -1 || reason.indexOf('failed to connect to websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5364" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="description" content="Enterprise collaboration portal with Google Auth, Calendar, and Drive integration" />
    <meta property="og:title" content="CIRCLE Workspace ASLI RI" />
    <meta property="og:description" content="Enterprise collaboration portal with Google Auth, Calendar, and Drive integration" />
    <meta property="og:type" content="website" />

    <script>
      (function() {
        try {
          var p = JSON.parse(localStorage.getItem("circle_user_prefs") || "{}");
          var m = p.theme_mode;
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
